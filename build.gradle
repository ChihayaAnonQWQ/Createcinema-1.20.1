plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

ext.bundledPlatforms = (project.findProperty('bundled_platforms') ?: 'windows-x86_64')
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }

base {
    archivesName = mod_id
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all',
                 '--output', file('src/generated/resources/').getAbsolutePath(),
                 '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

sourceSets {
    poiBridge {
        java { srcDir 'src/poiBridge/java' }
    }
    androidBridge {
        java { srcDir 'src/androidBridge/java' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com/' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

configurations {
    bytedecoBundle
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    implementation fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")

    compileOnly "org.spongepowered:mixin:0.8.5"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    // Dev-runtime only: Create 6.0.8 ships MixinExtras as a nested jar in its release build, which
    // fg.deobf's slim jar does not carry, so it must be supplied explicitly for the dev runs.
    runtimeOnly "io.github.llamalad7:mixinextras-forge:0.4.1"

    implementation "org.jsoup:jsoup:1.18.3"
    implementation "org.bytedeco:javacv:${javacv_version}"
    implementation "org.bytedeco:ffmpeg:${ffmpeg_version}"
    implementation "org.bytedeco:javacpp:${javacv_version}"

    bytedecoBundle("org.bytedeco:javacv:${javacv_version}") { transitive = false }
    bytedecoBundle("org.bytedeco:ffmpeg:${ffmpeg_version}") { transitive = false }
    bytedecoBundle("org.bytedeco:javacpp:${javacv_version}") { transitive = false }
    bytedecoBundle("org.jsoup:jsoup:1.18.3") { transitive = false }
    bundledPlatforms.each { platform ->
        bytedecoBundle("org.bytedeco:javacpp:${javacv_version}:${platform}") { transitive = false }
        bytedecoBundle("org.bytedeco:ffmpeg:${ffmpeg_version}:${platform}") { transitive = false }
    }

    // PPT/PPTX slide burning support, compiled into its own nested jar (META-INF/createcinema/poi-runtime.jar)
    // and loaded reflectively by ClientVideoBurner, exactly like the upstream 1.21.1 build does.
    poiBridgeImplementation('org.apache.poi:poi-ooxml:5.2.5') {
        exclude group: 'org.apache.logging.log4j'
    }
    poiBridgeImplementation('org.apache.poi:poi-scratchpad:5.2.5') {
        exclude group: 'org.apache.logging.log4j'
    }
    // Android WebView bridge is compiled against the Android SDK stubs; it is only instantiated on Android.
    androidBridgeImplementation 'com.google.android:android:4.1.1.4'
}

def poiRuntimeBundle = tasks.register('poiRuntimeBundle', Jar) {
    archiveFileName = 'poi-runtime.jar'
    destinationDirectory = layout.buildDirectory.dir('private-libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.poiBridge.output
    from({ configurations.poiBridgeRuntimeClasspath.collect { zipTree(it) } }) {
        exclude 'module-info.class'
        exclude 'META-INF/versions/*/module-info.class'
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        exclude 'org/apache/logging/log4j/**'
    }
}

// Index of every bundled native library, shipped inside the jar so the mod can pre-extract the DLLs itself
// (see NativeLibraries) instead of racing JavaCPP's write-then-load against virus scanners.
def nativeIndexFile = layout.buildDirectory.file('generated/native-index/createcinema-natives.txt')
def generateNativeIndex = tasks.register('generateNativeIndex') {
    inputs.files(configurations.bytedecoBundle)
    outputs.file(nativeIndexFile)
    doLast {
        def lines = new TreeSet<String>()
        configurations.bytedecoBundle.files.each { jarFile ->
            def zip = new java.util.zip.ZipFile(jarFile)
            try {
                zip.entries().each { entry ->
                    def name = entry.name
                    if (name.endsWith('.dll') || name.endsWith('.so') || name.endsWith('.dylib')) {
                        lines << (name + ' ' + entry.size)
                    }
                }
            } finally {
                zip.close()
            }
        }
        def target = nativeIndexFile.get().asFile
        target.parentFile.mkdirs()
        target.text = lines.join('\n') + '\n'
        println "native index entries: " + lines.size()
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn poiRuntimeBundle, generateNativeIndex
    from(nativeIndexFile) { rename { 'createcinema-natives.txt' } }
    from sourceSets.androidBridge.output
    from(poiRuntimeBundle.flatMap { it.archiveFile }) {
        into 'META-INF/createcinema'
    }
    from({
        configurations.bytedecoBundle.collect { zipTree(it) }
    }) {
        exclude 'module-info.class'
        exclude 'META-INF/versions/*/module-info.class'
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/MANIFEST.MF'
        exclude 'META-INF/maven/**'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '3000', '-Xlint:none']
}

tasks.register('printCompileClasspath') {
    doLast {
        file("${buildDir}/compile-classpath.txt").text = sourceSets.main.compileClasspath.asPath
        println "classpath entries: " + sourceSets.main.compileClasspath.files.size()
    }
}

tasks.register('printRuntimeClasspath') {
    doLast {
        file("${buildDir}/runtime-classpath.txt").text = sourceSets.main.runtimeClasspath.asPath
        println "runtime entries: " + sourceSets.main.runtimeClasspath.files.size()
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
